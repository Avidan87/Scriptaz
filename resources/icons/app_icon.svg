<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient: Deep Obsidian Charcoal -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C1F26" />
      <stop offset="100%" stop-color="#0E1014" />
    </linearGradient>
    
    <!-- Feather Accent Gradient: Luminous Antique Gold -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B768" />
      <stop offset="100%" stop-color="#B88A3A" />
    </linearGradient>

    <!-- Subtle Inner Border Glow -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C59A4E" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#C59A4E" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- macOS Style Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="4"/>

  <!-- Centered Feather Vector Icon -->
  <g transform="translate(100, 100) scale(13.0)" stroke="url(#goldGrad)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"></path>
    <line x1="16" y1="8" x2="2" y2="22"></line>
    <line x1="17.5" y1="15" x2="9" y2="15"></line>
  </g>
</svg>